name: Sync Upstream Repository

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jianchu-in/momo.float.phone.git || true
          git fetch upstream
          git checkout main
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml
          git merge upstream/main --no-edit -X theirs || true
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml
          git diff --staged --quiet || git commit -m "Auto-sync with upstream (restore workflow)"
          git push origin main
